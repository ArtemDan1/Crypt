[package]
name = "crypt-desktop"
version = "0.1.0"
description = "Crypt — encrypted personal knowledge base"
edition = "2024"
rust-version = "1.94"

[lib]
name = "crypt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crypt-core = { path = "../../../crates/crypt-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
rand = "0.8"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "block2", "NSString", "NSError", "NSNotification", "NSOperation", "NSDistributedNotificationCenter", "NSFileManager", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSPasteboard"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"

[dev-dependencies]
ssh-key = { version = "0.6.7", features = ["ed25519"] }
signature = "2"
tempfile = "3"
